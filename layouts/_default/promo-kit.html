{{ define "main" }}
<section class="page-header">
  <h1>{{ .Title }}</h1>
</section>
<section class="prose-section">
  {{ .Content }}
</section>

<section class="promo-section">
  <h2 class="prose-section__heading">Logos</h2>
  <div class="promo-logos">
    <div class="promo-logo">
      <img src="/images/promo/logo-1.png" alt="After School Special logo, badge version">
      <a class="home-cta" href="/images/promo/logo-1.png" download>Download PNG</a>
    </div>
    <div class="promo-logo">
      <img src="/images/promo/logo-2.png" alt="After School Special logo, circle version">
      <a class="home-cta" href="/images/promo/logo-2.png" download>Download PNG</a>
    </div>
  </div>
</section>

<section class="promo-section">
  <h2 class="prose-section__heading">Stage Plot</h2>
  <div class="promo-asset">
    <img src="/images/promo/stage-plot.png" alt="After School Special stage plot and input list">
    <a class="home-cta" href="/images/promo/stage-plot.png" download>Download PNG</a>
  </div>
</section>

<section class="promo-section">
  <h2 class="prose-section__heading">Promo Poster</h2>
  <div class="promo-asset">
    <img src="/images/promo/promo-poster.jpg" alt="After School Special promo poster">
    <a class="home-cta" href="/images/promo/promo-poster.jpg" download>Download JPG</a>
  </div>
</section>
{{ end }}
