{{ define "main" }}
<section class="page-header">
  <h1>{{ .Title }}</h1>
</section>
<section class="prose-section">
  {{ .Content }}
</section>

{{ $videos := .Site.Data.videos }}

{{ if $videos }}
<section class="video-catalog">
  <div class="video-player">
    <div class="video-player__frame">
      <iframe id="video-player-frame"
        src="https://www.youtube-nocookie.com/embed/{{ (index $videos 0).id }}"
        title="After School Special video player"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen
        loading="lazy"></iframe>
    </div>
  </div>

  <div class="video-grid">
    {{ range $videos }}
    <button type="button" class="video-grid__item" data-video-id="{{ .id }}">
      <img src="https://i.ytimg.com/vi/{{ .id }}/hqdefault.jpg" alt="{{ .title }}" loading="lazy">
      <span class="video-grid__title">{{ .title }}</span>
    </button>
    {{ end }}
  </div>
</section>

<script type="application/json" id="video-catalog-data">{{ $videos | jsonify }}</script>
<script>
(function () {
  var frame = document.getElementById('video-player-frame');
  var dataEl = document.getElementById('video-catalog-data');
  if (!frame || !dataEl) return;
  var videos = JSON.parse(dataEl.textContent || '[]');
  if (!videos.length) return;

  var startIndex = Math.floor(Math.random() * videos.length);
  var chosen = videos[startIndex];
  var rest = videos.filter(function (v, i) { return i !== startIndex; }).map(function (v) { return v.id; });
  var src = 'https://www.youtube-nocookie.com/embed/' + chosen.id;
  if (rest.length) src += '?playlist=' + rest.join(',');
  frame.src = src;

  document.querySelectorAll('.video-grid__item').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var id = btn.getAttribute('data-video-id');
      frame.src = 'https://www.youtube-nocookie.com/embed/' + id + '?autoplay=1';
      frame.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  });
})();
</script>

{{ else }}
<section class="prose-section">
  <p>No videos yet. Check back soon, or see our channel directly on
  <a href="https://www.youtube.com/@AfterSchoolSpecialBand">YouTube</a>.</p>
</section>
{{ end }}
{{ end }}
